plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.kannada.speechassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.kannada.speechassistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress "raw", "tflite", "task", "fst", "mdl", "int", "mat", "txt"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Core Android libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX core, camera2, lifecycle, and view
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // MediaPipe Tasks Vision
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Firebase (BOM for version alignment)
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    
    // WebRTC
    implementation 'org.jitsi:webrtc:124.0.0'

    // Offline On-Device Wake-Word Detection (Vosk Kaldi ASR with Grammar Mode)
    implementation ('com.alphacephei:vosk-android:0.3.45') {
        exclude group: 'net.java.dev.jna'
    }
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register("wrapper", Wrapper) {
    gradleVersion = '8.13'
}

tasks.register("prepareKotlinBuildScriptModel") {
    // Dummy task to satisfy Android Studio Kotlin import plugin
}
